[tool.poetry]
name = "ratichat"
version = "0.1.0"
description = "RatiChat - A context-aware AI chatbot with Matrix and Farcaster integration."
authors = ["RatiChat Team <your-email@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
# --- Core & Web ---
fastapi = "^0.111.0"
uvicorn = "^0.29.0"
pydantic = "^2.7.1"
pydantic-settings = "^2.2.1"
httpx = "^0.28.1"

# --- AI & LLM ---
google-genai = "^1.19.0"

# --- Matrix Integration ---
matrix-nio = "^0.24.0"  # Temporarily removed e2e extra due to python-olm build issues

# --- Blockchain & Web3 ---
web3 = "^6.15.1"
aiohttp = "^3.9.5"

# --- Utilities ---
python-dotenv = "^1.0.1"
markdown = "^3.6"
pillow = "^10.3.0"
base58 = "^2.1.1"
aiosqlite = "^0.21.0"
psycopg = {extras = ["binary", "pool"], version = "^3.1"}
alembic = "^1.13.0"
cryptography = "^45.0.3"
arweave-python-client = "^1.0.19"
python-multipart = "^0.0.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = ">=0.23.6,<2.0.0"
ruff = "^0.4.4"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"