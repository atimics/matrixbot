# RatiChat AI - Full-Stack Containerized Architecture with Snapchain

services:
  postgres:
    image: postgres:15-alpine
    container_name: ratichat_postgres
    environment:
      POSTGRES_USER: ratichat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_strong_password_here}
      POSTGRES_DB: ratichat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ratichat_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratichat -d ratichat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Snapchain Node with AWS Storage Support
  # Choose one of the deployment options below by uncommenting the appropriate section
  
  # Option 1: AWS EBS Storage (Recommended for AWS deployment)
  snapchain:
    image: farcasterxyz/snapchain:latest
    container_name: ratichat_snapchain
    init: true
    environment:
      RUST_BACKTRACE: "full"
      # AWS Configuration (set these in .env for production)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    entrypoint:
      - "/bin/bash"
      - "-c"
      - |
        #!/bin/bash
        # Ensure data directory exists and has proper permissions
        mkdir -p /app/.rocks /app/.rocks.snapshot
        chown -R 1000:1000 /app/.rocks /app/.rocks.snapshot
        
        cat > config.toml <<EOF
        rpc_address="0.0.0.0:3383"
        http_address="0.0.0.0:3381"
        rocksdb_dir=".rocks"
        fc_network="Mainnet"
        read_node = true
        
        [statsd]
        prefix="snap_read"
        addr="127.0.0.1:8125"
        use_tags=false
        
        [gossip]
        address="/ip4/0.0.0.0/udp/3382/quic-v1"
        bootstrap_peers = "/ip4/54.236.164.51/udp/3382/quic-v1,/ip4/54.87.204.167/udp/3382/quic-v1,/ip4/44.197.255.20/udp/3382/quic-v1,/ip4/34.195.157.114/udp/3382/quic-v1,/ip4/107.20.169.236/udp/3382/quic-v1"
        
        [consensus]
        validator_addresses = ["6bc2d8901443de856d2670b0c2ea12b6727132fa830f9030d3a44ac5da9b1a72","67474a42e0c6507198b73373b0558dfc94616b976ecfdf5c45fae11e2bee7102","81032ecefa4260e5a63424f5a4b8b18b52d717a52583b3ffe22c4a7b084911b8","2c0f58a364b7959c85e49b5a50d14d220c16f8bd7879b0d5d3f68b32de83ecb8","29696eb40eb900a329a8d2542edef15d552c9ba6ded7882276be1e9eca090970"]
        shard_ids = [1,2]
        num_shards = 2
        
        [snapshot]
        endpoint_url = "https://e1f9f185c6e63471dd39f96abd3413c4.r2.cloudflarestorage.com"
        load_db_from_snapshot=true
        EOF
        
        echo "Starting Snapchain with AWS-optimized configuration..."
        exec ./snapchain --config-path config.toml
    restart: unless-stopped
    ports:
      - "3381:3381/tcp" # HTTP API
      - "3382:3382/udp" # Gossip (for peering with other nodes)  
      - "3383:3383/tcp" # gRPC (this is what your backend will use)
    volumes:
      # Option A: For local development (Mac/Linux)
      - /tmp/snapchain-data/.rocks:/app/.rocks
      - /tmp/snapchain-data/.rocks.snapshot:/app/.rocks.snapshot
      
      # Option B: For AWS EBS deployment (uncomment when running on EC2): 
      # Mount EBS volume to host at /mnt/snapchain-data and use:
      # - /mnt/snapchain-data/.rocks:/app/.rocks
      # - /mnt/snapchain-data/.rocks.snapshot:/app/.rocks.snapshot
      
      # Option C: For Storj DCS deployment:
      # Run ./setup-storj-snapchain.sh first, then use:
      # - /mnt/snapchain-data/.rocks:/app/.rocks
      # - /mnt/snapchain-data/.rocks.snapshot:/app/.rocks.snapshot
      
      # Option C: For development with Docker volumes (will auto-create):
      # - snapchain_data:/app/.rocks  # Using EBS instead
      # - snapchain_snapshot:/app/.rocks.snapshot  # Using EBS instead
    networks:
      - ratichat_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3381/v1/info || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 10m # Give the node time to download snapshots (~2 hours for full sync)
    # AWS-specific resource limits (adjust based on your instance type)
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 4G
          cpus: '2.0'

  # Option 2: For local development or if you want to skip snapchain entirely,
  # comment out the above snapchain service and use remote snapchain via .env:
  # SNAPCHAIN_GRPC_HOST=your-remote-snapchain-host.com

  # NEW: Secure Farcaster Signer Service
  signer_service:
    build:
      context: ./src/signer_service
      dockerfile: Dockerfile
    container_name: ratichat_signer_service
    restart: unless-stopped
    ports:
      - "8002:8000" # Internal port 8000, exposed as 8002
    volumes:
      - signer_data:/secure_storage # Persistent encrypted key storage
    networks:
      - ratichat_network
    environment:
      # Key management configuration
      - SECURE_STORAGE_PATH=/secure_storage
      - SIGNER_KEY_ID=default
      - USE_CLOUD_HSM=false # Set to true for AWS KMS/Azure Key Vault
      - AUTO_GENERATE_KEY=true # Auto-generate key on first run
      - DEFAULT_FID=${FARCASTER_BOT_FID:-} # Set this in your .env file
      
      # For production, use cloud secrets management:
      # - AWS_REGION=us-east-1
      # - AWS_SIGNER_MASTER_KEY_ARN=arn:aws:secretsmanager:region:account:secret:name
      # - AZURE_KEY_VAULT_URL=https://your-vault.vault.azure.net/
      # - AZURE_SIGNER_MASTER_KEY_NAME=signer-master-key
      
      # For development only - use a strong base64-encoded key:
      - SIGNER_MASTER_KEY=${SIGNER_MASTER_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NEW: In-house Farcaster API service
  farcaster_api_service:
    build:
      context: ./src/farcaster_api_service
      dockerfile: Dockerfile
    container_name: ratichat_farcaster_api
    restart: unless-stopped
    ports:
      - "8001:8001" # Expose the API service
    volumes:
      - ./src/farcaster_api_service:/app # For development (remove in production)
    depends_on:
      # snapchain:
      #   condition: service_healthy
      signer_service:
        condition: service_healthy
    networks:
      - ratichat_network
    environment:
      # Connection settings for Snapchain node (local or remote)
      - SNAPCHAIN_GRPC_HOST=${SNAPCHAIN_GRPC_HOST:-snapchain}
      - SNAPCHAIN_GRPC_PORT=${SNAPCHAIN_GRPC_PORT:-3383}
      # For remote snapchain, you can set these in .env:
      # SNAPCHAIN_GRPC_HOST=your-remote-snapchain-host.com
      # SNAPCHAIN_GRPC_PORT=3383
      # Connection settings for Signer service
      - SIGNER_SERVICE_URL=http://signer_service:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  ratichat_backend:
    build:
      context: .
      dockerfile: Dockerfile  # Use main Dockerfile for production-ready build
    container_name: ratichat_backend
    ports:
      - "8000:8000" # Expose the API server
    volumes:
      - ./data:/app/data # Persist ratichat data (db, context storage, etc.)
      - ./matrix_store:/app/matrix_store # Persist matrix session data
      - ./.env:/app/.env:ro # Mount .env file for configuration (read-only)
    depends_on:
      postgres:
        condition: service_healthy
      # NEW: Make backend wait for Farcaster API service to be healthy
      farcaster_api_service:
        condition: service_healthy
    networks:
      - ratichat_network
    env_file:
      - .env # Load environment variables from .env file
    environment:
      # Additional runtime environment
      - PYTHONUNBUFFERED=1
      - RATICHAT_DB_PATH=/app/data/ratichat.db
      # PostgreSQL connection settings
      - POSTGRES_USER=ratichat
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_strong_password_here}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=ratichat
      - POSTGRES_PORT=5432
      # NEW: Environment variables for In-house Farcaster API
      - FARCASTER_CLIENT_TYPE=internal_api # Use our internal API instead of Neynar
      - FARCASTER_INTERNAL_API_URL=http://farcaster_api_service:8001 # Internal Docker network URL
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  ratichat_ui:
    build:
      context: ./src/ui-nextjs # Point to the Next.js app
      dockerfile: Dockerfile
    container_name: ratichat_ui
    ports:
      - "3000:3000"
    networks:
      - ratichat_network
    environment:
      # For client-side API calls (from browser)
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # For server-side API calls (from Next.js server)
      - INTERNAL_API_URL=http://ratichat_backend:8000
    depends_on:
      - ratichat_backend
    restart: unless-stopped

volumes:
  postgres_data:
  # NEW: Volume for Snapchain data persistence
  snapchain_data:
  snapchain_snapshot:
  # NEW: Volume for secure signer key storage
  signer_data:

networks:
  ratichat_network:
    driver: bridge
